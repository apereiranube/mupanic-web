name: Rankings UI validation
on:
  push:
    branches: [beta, main]
    paths:
      - 'overlay/templates/mupanic/css/style.css'
      - 'overlay/templates/mupanic/index.php'
      - 'overlay/templates/mupanic/inc/rankings-hero.php'
      - 'overlay/templates/mupanic/css/rankings.css'
      - 'overlay/templates/mupanic/js/rankings.js'
      - 'tests/rankings-browser.cjs'
      - 'tests/fixtures/rankings.php'
      - '.github/workflows/rankings-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          php -l overlay/templates/mupanic/index.php
          php -l overlay/templates/mupanic/inc/rankings-hero.php
          php -l tests/fixtures/rankings.php
          node --check overlay/templates/mupanic/js/rankings.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Validate rankings
        env:
          RANKINGS_SCREENSHOT_DIR: rankings-screenshots
        run: node tests/rankings-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rankings-screenshots
          path: rankings-screenshots/
