name: Shared header - page and Bootstrap parity
on:
  push:
    branches: [beta, feature/home-connected-20261020]
    paths:
      - 'overlay/templates/mupanic/index.php'
      - 'overlay/templates/mupanic/css/**'
      - 'overlay/templates/mupanic/js/main.js'
      - 'scripts/economy-sha256.txt'
      - 'tests/header-browser.cjs'
      - 'tests/fixtures/home-launch.php'
      - 'tests/fixtures/bootstrap-3.4.1.min.css'
      - '.github/workflows/header.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render and template integrity
        run: |
          php -l overlay/templates/mupanic/index.php
          python3 tests/home-render.py
          node --check tests/header-browser.cjs
          (cd overlay && sha256sum --status -c ../scripts/economy-sha256.txt)
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Compare eight pages with and without Bootstrap at four widths
        env:
          HEADER_SCREENSHOT_DIR: header-screenshots
        run: node tests/header-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-header
          path: header-screenshots/
