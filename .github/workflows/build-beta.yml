name: Build beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MU PANIC customizations
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout pinned WebEngine 1.2.7
        uses: actions/checkout@v4
        with:
          repository: lautaroangelico/WebEngine
          ref: 5cf16f1284abb970e29bde2a937dbec412d1bc94
          path: site

      - name: Apply MU PANIC overlay
        shell: bash
        run: |
          set -euo pipefail
          if [ -d custom/overlay ]; then
            cp -a custom/overlay/. site/
          fi
          rm -rf site/.git site/.github
          cp custom/UPSTREAM.md site/MU_PANIC_UPSTREAM.md

      - name: Publish deploy-beta branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site
          git init
          git config user.name "MU PANIC Bot"
          git config user.email "actions@github.com"
          git checkout -b deploy-beta
          git add -A
          git commit -m "build: beta ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deploy-beta
